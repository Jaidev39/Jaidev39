name: Import clean PAN IIT certificate image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pan-iit-original.yml'

permissions:
  contents: write

jobs:
  import-pan-iit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Download clean Library-original scan
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 'https://at.adobe.com/ku9OUMhMO16po2cf' --output assets/evidence/pan-iit-summit-2026-original.jpg
          test "$(file -b --mime-type assets/evidence/pan-iit-summit-2026-original.jpg)" = "image/jpeg"
          test "$(wc -c < assets/evidence/pan-iit-summit-2026-original.jpg)" -gt 50000
      - name: Commit clean original scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/evidence/pan-iit-summit-2026-original.jpg
          git commit -m "Add clean original PAN IIT Summit certificate scan"
          git push
